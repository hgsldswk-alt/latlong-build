name: LatLong
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ja
  knownRegions: [ja, en, zh-Hans]
settings:
  base:
    APP_ID: com.hgsldswk.latlong
    APP_STORE_ID: "6837839574"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  LatLong:
    type: application
    platform: iOS
    sources: [LatLong, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: LatLong AppStore
    info:
      path: LatLong/Info.plist
      properties:
        CFBundleDisplayName: 緯度経度メモ
        CFBundleDevelopmentRegion: ja
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        LatLongProProductID: $(APP_ID).pro
        LatLongTrialProductID: $(APP_ID).trial
        APP_STORE_ID: $(APP_STORE_ID)
        NSLocationWhenInUseUsageDescription: 現在地の緯度・経度を表示し、選んだ地点を端末に保存するために使います。
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.hgsldswk.latlong.waypoint
            UTTypeDescription: LatLong Waypoint
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [latlong]
  LatLongTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LatLongTests, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  LatLongUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [LatLongUITests]
    dependencies:
      - target: LatLong
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LatLong
schemes:
  LatLong:
    build:
      targets:
        LatLong: all
        LatLongTests: [test]
    test:
      config: Debug
      targets: [LatLongTests]
  LatLongUI:
    build:
      targets:
        LatLong: all
        LatLongUITests: [test]
    test:
      config: Debug
      targets: [LatLongUITests]
